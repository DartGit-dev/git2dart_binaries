# hooks.yml
# Ganchos opcionais executados antes ou depois dos skills forward do Reversa.
#
# Esquema por gancho:
#   command:     command suggested (optional: true) or required (optional: false)
#   description: short text shown to the user
#   enabled:     true | false. Sem esse campo, vale como true.
#   optional:    true (shows clickable link) | false (runs automatically and waits)
#
# Regras:
#   Invalid YAML is tolerated here: the skill continues normally, without hooks.
#   This file has no condition DSL. If a hook must not run, use enabled: false.
#
# By default, all hooks are empty. Add only those relevant to your project.

schema-version: 1

