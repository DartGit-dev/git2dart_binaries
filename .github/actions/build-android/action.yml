name: Build libgit2 Android OpenSSL
description: Build libgit2 with OpenSSL for Android
inputs:
  libgit2_version:
    description: Version of libgit2 to build
    required: true
  libssh2_version:
    description: Version of libssh2 to build
    required: true
  openssl_version:
    description: Version of OpenSSL to build
    required: true
  architecture:
    description: Android ABI to build (armeabi-v7a, arm64-v8a, x86, x86_64)
    required: true
  android_api_level:
    description: Minimum Android API level to target
    required: false
    default: "21"

runs:
  using: composite
  steps:
    - name: Install prerequisites
      shell: bash
      run: |
        set -euo pipefail
        sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -o Acquire::Retries=3 -y --no-install-recommends \
          build-essential ca-certificates cmake git ninja-build perl pkg-config python3 unzip

    - name: Set up Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1.6.0
      with:
        ndk-version: r26d
        add-to-path: false

    - name: Prepare environment
      shell: bash
      env:
        ARCHITECTURE: ${{ inputs.architecture }}
        ANDROID_API_LEVEL: ${{ inputs.android_api_level }}
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        set -euo pipefail

        if [ -z "${ANDROID_NDK_ROOT:-}" ] || [ ! -d "$ANDROID_NDK_ROOT" ]; then
          echo "::error::Android NDK path is invalid: ${ANDROID_NDK_ROOT:-unset}"
          exit 1
        fi

        case "$ARCHITECTURE" in
          armeabi-v7a)
            OPENSSL_ARCH="android-arm"
            ;;
          arm64-v8a)
            OPENSSL_ARCH="android-arm64"
            ;;
          x86)
            OPENSSL_ARCH="android-x86"
            ;;
          x86_64)
            OPENSSL_ARCH="android-x86_64"
            ;;
          *)
            echo "::error::Unsupported architecture: $ARCHITECTURE"
            exit 1
            ;;
        esac

        HOST_UNAME=$(uname -s)
        case "$HOST_UNAME" in
          Darwin*)
            HOST_TAG="darwin-x86_64"
            NCPU=$(sysctl -n hw.ncpu)
            ;;
          Linux*)
            HOST_TAG="linux-x86_64"
            NCPU=$(nproc)
            ;;
          *)
            echo "::error::Unsupported host: $HOST_UNAME"
            exit 1
            ;;
        esac

        ANDROID_LLVM_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/$HOST_TAG/bin"
        if [ ! -d "$ANDROID_LLVM_BIN" ]; then
          echo "::error::NDK LLVM toolchain not found: $ANDROID_LLVM_BIN"
          exit 1
        fi

        BUILD_ROOT="/tmp/git2dart-android-$ARCHITECTURE"
        OPENSSL_INSTALL="$BUILD_ROOT/openssl_install"
        LIBSSH2_INSTALL="$BUILD_ROOT/libssh2_install"
        LIBGIT2_INSTALL="$BUILD_ROOT/libgit2_install"
        OUTPUT_DIR="$BUILD_ROOT/export"

        mkdir -p "$BUILD_ROOT" "$OPENSSL_INSTALL" "$LIBSSH2_INSTALL" "$LIBGIT2_INSTALL" "$OUTPUT_DIR"

        {
          echo "ARCHITECTURE=$ARCHITECTURE"
          echo "ANDROID_ABI=$ARCHITECTURE"
          echo "OPENSSL_ARCH=$OPENSSL_ARCH"
          echo "ANDROID_API_LEVEL=$ANDROID_API_LEVEL"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_LLVM_BIN=$ANDROID_LLVM_BIN"
          echo "HOST_TAG=$HOST_TAG"
          echo "NCPU=$NCPU"
          echo "BUILD_ROOT=$BUILD_ROOT"
          echo "OPENSSL_INSTALL=$OPENSSL_INSTALL"
          echo "LIBSSH2_INSTALL=$LIBSSH2_INSTALL"
          echo "LIBGIT2_INSTALL=$LIBGIT2_INSTALL"
          echo "OUTPUT_DIR=$OUTPUT_DIR"
        } >> "$GITHUB_ENV"

    - name: Fingerprint Android toolchain
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        raw="${RUNNER_OS}-${RUNNER_ARCH}-ndk-r26d-$($ANDROID_LLVM_BIN/clang --version | sed -n '1p')-$(cmake --version | sed -n '1p')-android-api-${{ inputs.android_api_level }}"
        fingerprint="$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

    - name: Restore Android native cache
      id: native-cache
      uses: actions/cache/restore@v5
      with:
        path: /tmp/git2dart-android-${{ inputs.architecture }}
        key: native-v1-android-${{ inputs.architecture }}-${{ steps.toolchain.outputs.fingerprint }}-${{ inputs.libgit2_version }}-${{ inputs.libssh2_version }}-${{ inputs.openssl_version }}-${{ hashFiles('.github/actions/build-android/action.yml', '.github/scripts/native_cache_manifest.py') }}

    - name: Validate Android native cache
      id: validate-cache
      shell: bash
      run: |
        set -euo pipefail
        cache_root="/tmp/git2dart-android-${{ inputs.architecture }}"
        if [ "${{ steps.native-cache.outputs.cache-hit }}" = "true" ] && \
          python3 .github/scripts/native_cache_manifest.py validate \
            --manifest "$cache_root/manifest.json" \
            --export-root "$cache_root/export" \
            --platform android \
            --abi "${{ inputs.architecture }}" \
            --libgit2 "${{ inputs.libgit2_version }}" \
            --libssh2 "${{ inputs.libssh2_version }}" \
            --openssl "${{ inputs.openssl_version }}" \
            --toolchain "${{ steps.toolchain.outputs.fingerprint }}"; then
          echo 'valid=true' >> "$GITHUB_OUTPUT"
        else
          rm -rf "$cache_root"
          mkdir -p "$cache_root"
          echo 'valid=false' >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout OpenSSL
      if: steps.validate-cache.outputs.valid != 'true'
      uses: actions/checkout@v6
      with:
        repository: openssl/openssl
        ref: refs/tags/openssl-${{ inputs.openssl_version }}
        path: ./openssl

    - name: Build OpenSSL
      if: steps.validate-cache.outputs.valid != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mv ./openssl "$BUILD_ROOT/openssl-src" && cd "$BUILD_ROOT/openssl-src"
        export PATH="$ANDROID_LLVM_BIN:$PATH"
        ./Configure "$OPENSSL_ARCH" -D__ANDROID_API__=$ANDROID_API_LEVEL --prefix="$OPENSSL_INSTALL" no-tests shared
        make clean || true
        make -j"$(nproc)"
        make install_sw

    - name: Checkout libssh2
      if: steps.validate-cache.outputs.valid != 'true'
      uses: actions/checkout@v6
      with:
        repository: libssh2/libssh2
        ref: refs/tags/libssh2-${{ inputs.libssh2_version }}
        path: ./libssh2

    - name: Build libssh2
      if: steps.validate-cache.outputs.valid != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mv ./libssh2 "$BUILD_ROOT/libssh2-src" && cd "$BUILD_ROOT/libssh2-src"
        cmake -B bld \
          -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DCRYPTO_BACKEND=OpenSSL \
          -DOPENSSL_ROOT_DIR="$OPENSSL_INSTALL" \
          -DOPENSSL_INCLUDE_DIR="$OPENSSL_INSTALL/include" \
          -DOPENSSL_SSL_LIBRARY="$OPENSSL_INSTALL/lib/libssl.so" \
          -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_INSTALL/lib/libcrypto.so" \
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI="$ANDROID_ABI" \
          -DANDROID_PLATFORM=android-${ANDROID_API_LEVEL} \
          -DCMAKE_INSTALL_PREFIX="$LIBSSH2_INSTALL"
        cmake --build bld --target install -- -j"$NCPU"

    - name: Checkout libgit2
      if: steps.validate-cache.outputs.valid != 'true'
      uses: actions/checkout@v6
      with:
        repository: libgit2/libgit2
        ref: refs/tags/v${{ inputs.libgit2_version }}
        path: ./libgit2

    - name: Build libgit2
      if: steps.validate-cache.outputs.valid != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mv ./libgit2 "$BUILD_ROOT/libgit2-src" && cd "$BUILD_ROOT/libgit2-src"
        cmake -B bld \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=OFF \
          -DBUILD_SHARED_LIBS=ON \
          -DUSE_SSH=libssh2 \
          -DUSE_HTTPS=OpenSSL \
          -DEXPERIMENTAL_SHA256=ON \
          -DLIBSSH2_INCLUDE_DIR="$LIBSSH2_INSTALL/include" \
          -DLIBSSH2_LIBRARY="$LIBSSH2_INSTALL/lib/libssh2.so" \
          -DOPENSSL_ROOT_DIR="$OPENSSL_INSTALL" \
          -DOPENSSL_INCLUDE_DIR="$OPENSSL_INSTALL/include" \
          -DOPENSSL_SSL_LIBRARY="$OPENSSL_INSTALL/lib/libssl.so" \
          -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_INSTALL/lib/libcrypto.so" \
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI="$ANDROID_ABI" \
          -DANDROID_PLATFORM=android-${ANDROID_API_LEVEL} \
          -DCMAKE_INSTALL_PREFIX="$LIBGIT2_INSTALL"
        cmake --build bld --target install -- -j"$NCPU"

    - name: Copy outputs
      if: steps.validate-cache.outputs.valid != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$OUTPUT_DIR"
        cp "$OPENSSL_INSTALL/lib/libssl.so" "$OUTPUT_DIR/"
        cp "$OPENSSL_INSTALL/lib/libcrypto.so" "$OUTPUT_DIR/"
        cp "$LIBSSH2_INSTALL/lib/libssh2.so" "$OUTPUT_DIR/"
        cp "$LIBGIT2_INSTALL/lib/libgit2-experimental.so" "$OUTPUT_DIR/libgit2.so"

        declare -A before_sizes
        for library in libssl.so libcrypto.so libssh2.so libgit2.so; do
          before_sizes["$library"]="$(wc -c < "$OUTPUT_DIR/$library" | tr -d ' ')"
          "$ANDROID_LLVM_BIN/llvm-strip" --strip-unneeded "$OUTPUT_DIR/$library"
        done

        exported_symbols="$("$ANDROID_LLVM_BIN/llvm-readelf" --dyn-syms --wide "$OUTPUT_DIR/libgit2.so")"
        grep -q 'git_libgit2_init' <<< "$exported_symbols"
        grep -q 'git_repository_open' <<< "$exported_symbols"

        {
          echo "### Android $ANDROID_ABI native artifact sizes"
          echo '| File | Before strip | After strip |'
          echo '| --- | ---: | ---: |'
          for library in libssl.so libcrypto.so libssh2.so libgit2.so; do
            after_size="$(wc -c < "$OUTPUT_DIR/$library" | tr -d ' ')"
            echo "| $library | ${before_sizes[$library]} | $after_size |"
          done
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Create Android cache manifest
      if: steps.validate-cache.outputs.valid != 'true'
      shell: bash
      run: |
        cache_root="/tmp/git2dart-android-${{ inputs.architecture }}"
        python3 .github/scripts/native_cache_manifest.py create \
          --manifest "$cache_root/manifest.json" \
          --export-root "$cache_root/export" \
          --platform android \
          --abi "${{ inputs.architecture }}" \
          --libgit2 "${{ inputs.libgit2_version }}" \
          --libssh2 "${{ inputs.libssh2_version }}" \
          --openssl "${{ inputs.openssl_version }}" \
          --toolchain "${{ steps.toolchain.outputs.fingerprint }}"

    - name: Save Android native cache
      if: steps.validate-cache.outputs.valid != 'true'
      uses: actions/cache/save@v5
      with:
        path: /tmp/git2dart-android-${{ inputs.architecture }}
        key: native-v1-android-${{ inputs.architecture }}-${{ steps.toolchain.outputs.fingerprint }}-${{ inputs.libgit2_version }}-${{ inputs.libssh2_version }}-${{ inputs.openssl_version }}-${{ hashFiles('.github/actions/build-android/action.yml', '.github/scripts/native_cache_manifest.py') }}

    - name: Upload Android artifact
      uses: actions/upload-artifact@v7
      with:
        name: cache-android-${{ inputs.architecture }}
        path: /tmp/git2dart-android-${{ inputs.architecture }}/export/**
        retention-days: 1
