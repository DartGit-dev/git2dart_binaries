name: Generate libgit2 dart bindings
description: Generate libgit2 dart bindings
inputs:
  libgit2_version:
    description: Version of libgit2 to build
    required: true
  flutter_version:
    description: Flutter SDK version used to generate bindings
    required: true
runs:
  using: composite
  steps:
    - name: Fingerprint bindings toolchain
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        raw="${RUNNER_OS}-${RUNNER_ARCH}-$(clang --version | sed -n '1p')-$(cmake --version | sed -n '1p')-flutter-${{ inputs.flutter_version }}"
        fingerprint="$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

    - name: Restore bindings cache
      id: bindings-cache
      uses: actions/cache/restore@v5
      with:
        path: /tmp/git2dart-bindings-cache
        key: native-v1-bindings-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ inputs.libgit2_version }}-none-none-${{ hashFiles('.github/actions/generate-bindings/action.yml', '.github/scripts/native_cache_manifest.py') }}

    - name: Validate bindings cache
      id: validate-cache
      shell: bash
      run: |
        set -euo pipefail
        cache_root=/tmp/git2dart-bindings-cache
        if [ "${{ steps.bindings-cache.outputs.cache-hit }}" = "true" ] && \
          python3 .github/scripts/native_cache_manifest.py validate \
            --manifest "$cache_root/manifest.json" \
            --export-root "$cache_root/export" \
            --platform bindings \
            --abi "${RUNNER_ARCH}" \
            --libgit2 "${{ inputs.libgit2_version }}" \
            --libssh2 none \
            --openssl none \
            --toolchain "${{ steps.toolchain.outputs.fingerprint }}"; then
          mkdir -p lib/src
          cp "$cache_root/export/bindings.dart" lib/src/bindings.dart
          echo 'valid=true' >> "$GITHUB_OUTPUT"
        else
          rm -rf "$cache_root"
          echo 'valid=false' >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/checkout@v6
      if: steps.validate-cache.outputs.valid != 'true'
      with:
        repository: libgit2/libgit2
        ref: refs/tags/v${{ inputs.libgit2_version }}
        path: ./libgit2

    - name: Move include to dir
      if: steps.validate-cache.outputs.valid != 'true'
      shell: bash
      run: |
        mv ./libgit2/include ./headers && rm -fR ./libgit2

    - name: Install libclang
      if: steps.validate-cache.outputs.valid != 'true'
      shell: bash
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 && sudo DEBIAN_FRONTEND=noninteractive apt-get install  -o Acquire::Retries=3 -y --no-install-recommends libclang-dev
    
    - name: Run ffigen
      if: steps.validate-cache.outputs.valid != 'true'
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter_version }}
        cache: true
        pub-cache: true
        pub-cache-key: git2dart-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.yaml') }}
    
    - name: generate bindings
      if: steps.validate-cache.outputs.valid != 'true'
      shell: bash
      run: |
        flutter pub get
        rm headers/git2/deprecated.h
        dart run ffigen --config ffigen.yaml --ignore-source-errors

    - name: Create bindings cache manifest
      if: steps.validate-cache.outputs.valid != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cache_root=/tmp/git2dart-bindings-cache
        mkdir -p "$cache_root/export"
        cp lib/src/bindings.dart "$cache_root/export/bindings.dart"
        python3 .github/scripts/native_cache_manifest.py create \
          --manifest "$cache_root/manifest.json" \
          --export-root "$cache_root/export" \
          --platform bindings \
          --abi "${RUNNER_ARCH}" \
          --libgit2 "${{ inputs.libgit2_version }}" \
          --libssh2 none \
          --openssl none \
          --toolchain "${{ steps.toolchain.outputs.fingerprint }}"

    - name: Save bindings cache
      if: steps.validate-cache.outputs.valid != 'true'
      uses: actions/cache/save@v5
      with:
        path: /tmp/git2dart-bindings-cache
        key: native-v1-bindings-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ inputs.libgit2_version }}-none-none-${{ hashFiles('.github/actions/generate-bindings/action.yml', '.github/scripts/native_cache_manifest.py') }}

    - name: Cache git2 library
      uses: actions/upload-artifact@v7
      with:
        name: cache-bindings
        path: lib/src/bindings.dart
        retention-days: 1
