name: Build libgit2 macOS
description: Build libgit2 with static libssh2 and OpenSSL on macOS
inputs:
  libgit2_version:
    description: Version of libgit2 to build
    required: true
  libssh2_version:
    description: Version of libssh2 to build
    required: true
  openssl_version:
    description: Version of OpenSSL to build
    required: true
runs:
  using: composite
  steps:
    - name: Fingerprint macOS toolchain
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
        raw="${RUNNER_OS}-${RUNNER_ARCH}-$(clang --version | sed -n '1p')-$(cmake --version | sed -n '1p')-macosx-${sdk_version}"
        fingerprint="$(printf '%s' "$raw" | shasum -a 256 | cut -d' ' -f1)"
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

    - name: Restore macOS native cache
      id: native-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          openssl
          libssh2
          libgit2
          /tmp/git2dart-macos
          export
          /tmp/git2dart-macos-manifest.json
        key: native-v2-macos-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ inputs.libgit2_version }}-${{ inputs.libssh2_version }}-${{ inputs.openssl_version }}-${{ hashFiles('.github/actions/build-macos/action.yml', '.github/scripts/native_cache_manifest.py') }}

    - name: Validate macOS native cache
      id: validate-cache
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ steps.native-cache.outputs.cache-hit }}" = "true" ] && \
          python3 .github/scripts/native_cache_manifest.py validate \
            --manifest /tmp/git2dart-macos-manifest.json \
            --export-root export \
            --platform macos \
            --abi "${RUNNER_ARCH}" \
            --libgit2 "${{ inputs.libgit2_version }}" \
            --libssh2 "${{ inputs.libssh2_version }}" \
            --openssl "${{ inputs.openssl_version }}" \
            --toolchain "${{ steps.toolchain.outputs.fingerprint }}" \
            --provenance source-build \
            --source-ref "refs/tags/openssl-${{ inputs.openssl_version }}"; then
          echo 'valid=true' >> "$GITHUB_OUTPUT"
        else
          rm -rf openssl libssh2 libgit2 /tmp/git2dart-macos export /tmp/git2dart-macos-manifest.json
          echo 'valid=false' >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout OpenSSL
      if: steps.validate-cache.outputs.valid != 'true'
      uses: actions/checkout@v6
      with:
        repository: openssl/openssl
        ref: refs/tags/openssl-${{ inputs.openssl_version }}
        path: ./openssl

    - name: Checkout libssh2
      if: steps.validate-cache.outputs.valid != 'true'
      uses: actions/checkout@v6
      with:
        repository: libssh2/libssh2
        ref: refs/tags/libssh2-${{ inputs.libssh2_version }}
        path: ./libssh2

    - name: Checkout libgit2
      if: steps.validate-cache.outputs.valid != 'true'
      uses: actions/checkout@v6
      with:
        repository: libgit2/libgit2
        ref: refs/tags/v${{ inputs.libgit2_version }}
        path: ./libgit2

    - name: Build libgit2
      if: steps.validate-cache.outputs.valid != 'true'
      shell: bash
      run: |
        set -euo pipefail

        build_root="/tmp/git2dart-macos"
        openssl_install="$build_root/openssl"
        libssh2_install="$build_root/libssh2"
        libgit2_install="$build_root/libgit2"

        rm -rf "$build_root"
        mkdir -p "$build_root"

        case "$(uname -m)" in
          arm64) openssl_target="darwin64-arm64-cc" ;;
          x86_64) openssl_target="darwin64-x86_64-cc" ;;
          *)
            echo "::error::Unsupported macOS architecture: $(uname -m)"
            exit 1
            ;;
        esac

        cp -R ./openssl "$build_root/openssl-src"
        pushd "$build_root/openssl-src"
        ./Configure "$openssl_target" \
          no-shared \
          no-tests \
          --prefix="$openssl_install"
        make clean || true
        make -j"$(sysctl -n hw.ncpu)" build_libs
        make install_dev
        popd

        cmake -S ./libssh2 -B "$build_root/libssh2-bld" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_TESTING=OFF \
          -DBUILD_TESTS=OFF \
          -DCRYPTO_BACKEND=OpenSSL \
          -DOPENSSL_ROOT_DIR="$openssl_install" \
          -DOPENSSL_INCLUDE_DIR="$openssl_install/include" \
          -DOPENSSL_SSL_LIBRARY="$openssl_install/lib/libssl.a" \
          -DOPENSSL_CRYPTO_LIBRARY="$openssl_install/lib/libcrypto.a" \
          -DCMAKE_INSTALL_PREFIX="$libssh2_install"
        cmake --build "$build_root/libssh2-bld" --target install -- -j"$(sysctl -n hw.ncpu)"

        PKG_CONFIG_PATH="$libssh2_install/lib/pkgconfig" \
        cmake -S ./libgit2 -B "$build_root/libgit2-bld" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -DUSE_SSH=libssh2 \
          -DUSE_HTTPS=OpenSSL \
          -DEXPERIMENTAL_SHA256=ON \
          -DLIBSSH2_INCLUDE_DIR="$libssh2_install/include" \
          -DLIBSSH2_LIBRARY="$libssh2_install/lib/libssh2.a" \
          -DOPENSSL_ROOT_DIR="$openssl_install" \
          -DOPENSSL_INCLUDE_DIR="$openssl_install/include" \
          -DOPENSSL_SSL_LIBRARY="$openssl_install/lib/libssl.a" \
          -DOPENSSL_CRYPTO_LIBRARY="$openssl_install/lib/libcrypto.a" \
          -DCMAKE_LIBRARY_PATH="$libssh2_install/lib;$openssl_install/lib" \
          -DCMAKE_FIND_ROOT_PATH="$libssh2_install;$openssl_install" \
          -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
          -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
          -DCMAKE_INSTALL_PREFIX="$libgit2_install"
        cmake --build "$build_root/libgit2-bld" --target install -- -j"$(sysctl -n hw.ncpu)"

    - name: Run libgit2 tests
      shell: bash
      run: |
        set -euo pipefail
        /tmp/git2dart-macos/libgit2-bld/libgit2_tests

    - name: Export git2 library
      if: steps.validate-cache.outputs.valid != 'true'
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p export
        cp /tmp/git2dart-macos/libgit2/lib/libgit2-experimental.dylib export/libgit2.dylib
        install_name_tool -id @rpath/libgit2.dylib export/libgit2.dylib

        before_bytes="$(wc -c < export/libgit2.dylib | tr -d ' ')"
        strip -x export/libgit2.dylib
        after_bytes="$(wc -c < export/libgit2.dylib | tr -d ' ')"

        exported_symbols="$(nm -gU export/libgit2.dylib)"
        grep -q '_git_libgit2_init$' <<< "$exported_symbols"
        grep -q '_git_repository_open$' <<< "$exported_symbols"

        if otool -L export/libgit2.dylib | grep -E '/(opt/homebrew|usr/local)/|libssh2|libcrypto|libssl'; then
          echo "::error::Exported macOS dylibs must not reference Homebrew paths"
          echo "::error::libssh2 and OpenSSL must be statically linked into libgit2.dylib"
          exit 1
        fi

        otool -L export/libgit2.dylib

        {
          echo '### macOS native artifact sizes'
          echo '| File | Before strip | After strip |'
          echo '| --- | ---: | ---: |'
          echo "| libgit2.dylib | $before_bytes | $after_bytes |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Create macOS cache manifest
      if: steps.validate-cache.outputs.valid != 'true'
      shell: bash
      run: |
        python3 .github/scripts/native_cache_manifest.py create \
          --manifest /tmp/git2dart-macos-manifest.json \
          --export-root export \
          --platform macos \
          --abi "${RUNNER_ARCH}" \
          --libgit2 "${{ inputs.libgit2_version }}" \
          --libssh2 "${{ inputs.libssh2_version }}" \
          --openssl "${{ inputs.openssl_version }}" \
          --toolchain "${{ steps.toolchain.outputs.fingerprint }}" \
          --provenance source-build \
          --source-ref "refs/tags/openssl-${{ inputs.openssl_version }}"
        cp /tmp/git2dart-macos-manifest.json /tmp/git2dart-macos-provenance.json
        cp /tmp/git2dart-macos-provenance.json export/openssl-provenance.json

    - name: Save macOS native cache
      if: steps.validate-cache.outputs.valid != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          openssl
          libssh2
          libgit2
          /tmp/git2dart-macos
          export
          /tmp/git2dart-macos-manifest.json
          /tmp/git2dart-macos-provenance.json
        key: native-v2-macos-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ inputs.libgit2_version }}-${{ inputs.libssh2_version }}-${{ inputs.openssl_version }}-${{ hashFiles('.github/actions/build-macos/action.yml', '.github/scripts/native_cache_manifest.py') }}

    - name: Cache git2 library
      uses: actions/upload-artifact@v7
      with:
        name: cache-macos
        path: |
          export/**
        retention-days: 1
