name: Build libgit2 Windows
description: Build libgit2 and libssh2 on Windows with OpenSSL
inputs:
  libgit2_version:
    description: Version of libgit2 to build
    required: true
  libssh2_version:
    description: Version of libssh2 to build
    required: true
  openssl_version:
    description: Pinned OpenSSL version to build from source
    required: true
runs:
  using: composite
  steps:
    - name: Set up MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Verify source-build prerequisites
      shell: pwsh
      run: |
        cmake --version
        ninja --version
        Get-Command perl -ErrorAction Stop
        Get-Command nmake -ErrorAction Stop

    - name: Fingerprint Windows toolchain
      id: toolchain
      shell: pwsh
      run: |
        $compiler = (Get-Item (Get-Command cl.exe -ErrorAction Stop).Source).VersionInfo.FileVersion
        $cmake = cmake --version | Select-Object -First 1
        $raw = "$env:RUNNER_OS-$env:RUNNER_ARCH-$compiler-$cmake-openssl-${{ inputs.openssl_version }}"
        $bytes = [System.Text.Encoding]::UTF8.GetBytes($raw)
        $fingerprint = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
        "fingerprint=$fingerprint" >> $env:GITHUB_OUTPUT
        "openssl_version=${{ inputs.openssl_version }}" >> $env:GITHUB_OUTPUT

    - name: Restore Windows native cache
      id: native-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          .native-cache/windows
        key: native-v2-windows-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ inputs.libgit2_version }}-${{ inputs.libssh2_version }}-${{ inputs.openssl_version }}-${{ hashFiles('.github/actions/build-windows/action.yml', '.github/scripts/native_cache_manifest.py') }}
        restore-keys: |
          native-v2-windows-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ inputs.libgit2_version }}-${{ inputs.libssh2_version }}-${{ inputs.openssl_version }}-

    - name: Validate Windows native cache
      id: validate-cache
      shell: pwsh
      run: |
        $valid = $false
        $cacheRoot = Join-Path $env:GITHUB_WORKSPACE '.native-cache/windows'
        if ('${{ steps.native-cache.outputs.cache-matched-key }}' -ne '') {
          foreach ($name in @('libssh2', 'libgit2', 'openssl', 'export')) {
            $source = Join-Path $cacheRoot $name
            $destination = Join-Path 'D:\' $name
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination $destination -Recurse -Force
            }
          }
          Copy-Item -LiteralPath (Join-Path $cacheRoot 'git2dart-windows-manifest.json') -Destination 'D:\git2dart-windows-manifest.json' -Force -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath (Join-Path $cacheRoot 'git2dart-windows-provenance.json') -Destination 'D:\git2dart-windows-provenance.json' -Force -ErrorAction SilentlyContinue
          python .github/scripts/native_cache_manifest.py validate `
            --manifest D:/git2dart-windows-manifest.json `
            --export-root D:/export `
            --platform windows `
            --abi "$env:RUNNER_ARCH" `
            --libgit2 '${{ inputs.libgit2_version }}' `
            --libssh2 '${{ inputs.libssh2_version }}' `
            --openssl '${{ steps.toolchain.outputs.openssl_version }}' `
            --toolchain '${{ steps.toolchain.outputs.fingerprint }}' `
            --provenance source-build `
            --source-ref 'refs/tags/openssl-${{ inputs.openssl_version }}'
          $valid = $LASTEXITCODE -eq 0
          # A cache miss is expected and must continue to the source build.
          $global:LASTEXITCODE = 0
        }

        if ($valid) {
          'valid=true' >> $env:GITHUB_OUTPUT
        } else {
          foreach ($path in @(
            (Join-Path $env:GITHUB_WORKSPACE 'libssh2'),
            (Join-Path $env:GITHUB_WORKSPACE 'libgit2')
          )) {
            if ($path.StartsWith("$env:GITHUB_WORKSPACE\") -and (Test-Path -LiteralPath $path)) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }
          foreach ($path in @('D:\libssh2', 'D:\libgit2', 'D:\openssl', 'D:\export')) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }
          Remove-Item -LiteralPath 'D:\git2dart-windows-manifest.json' -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'D:\git2dart-windows-provenance.json' -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $cacheRoot -Recurse -Force -ErrorAction SilentlyContinue
          'valid=false' >> $env:GITHUB_OUTPUT
        }

    - name: Checkout libssh2
      if: steps.validate-cache.outputs.valid != 'true'
      uses: actions/checkout@v6
      with:
        repository: libssh2/libssh2
        ref: refs/tags/libssh2-${{ inputs.libssh2_version }}
        path: ./libssh2

    - name: Checkout and build OpenSSL
      if: steps.validate-cache.outputs.valid != 'true'
      uses: actions/checkout@v6
      with:
        repository: openssl/openssl
        ref: refs/tags/openssl-${{ inputs.openssl_version }}
        path: ./openssl

    - name: Build and test OpenSSL
      if: steps.validate-cache.outputs.valid != 'true'
      shell: pwsh
      run: |
        cd openssl
        perl Configure VC-WIN64A shared no-tests --prefix=D:/openssl/install --openssldir=D:/openssl/install/ssl
        nmake
        nmake install_sw
        if (-not (Test-Path D:/openssl/install/include/openssl/ssl.h)) { throw 'OpenSSL source build did not install headers' }
        if (-not (Get-ChildItem D:/openssl/install/bin/libcrypto*.dll -File -ErrorAction SilentlyContinue)) { throw 'OpenSSL source build did not install libcrypto DLL' }
        if (-not (Get-ChildItem D:/openssl/install/bin/libssl*.dll -File -ErrorAction SilentlyContinue)) { throw 'OpenSSL source build did not install libssl DLL' }
        "OPENSSL_ROOT_DIR=D:/openssl/install" >> $env:GITHUB_ENV
        "OPENSSL_CRYPTO_LIBRARY=D:/openssl/install/lib/libcrypto.lib" >> $env:GITHUB_ENV
        "OPENSSL_SSL_LIBRARY=D:/openssl/install/lib/libssl.lib" >> $env:GITHUB_ENV

    - name: Build libssh2
      if: steps.validate-cache.outputs.valid != 'true'
      shell: pwsh
      run: |
        cd libssh2
        cmake -S . -B build -G Ninja -DCRYPTO_BACKEND=OpenSSL -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" -DOPENSSL_CRYPTO_LIBRARY="$env:OPENSSL_CRYPTO_LIBRARY" -DOPENSSL_SSL_LIBRARY="$env:OPENSSL_SSL_LIBRARY" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=D:/libssh2/install
        cmake --build build --parallel --target install
        mkdir -p D:/export
        copy D:/libssh2/install/bin/libssh2.dll D:/export/libssh2.dll
        Get-ChildItem "D:/openssl/install/bin/libcrypto*.dll", "D:/openssl/install/bin/libssl*.dll" -File | Copy-Item -Destination D:/export

    - name: Checkout libgit2
      if: steps.validate-cache.outputs.valid != 'true'
      uses: actions/checkout@v6
      with:
        repository: libgit2/libgit2
        ref: refs/tags/v${{ inputs.libgit2_version }}
        path: ./libgit2

    - name: Build libgit2
      if: steps.validate-cache.outputs.valid != 'true'
      shell: pwsh
      run: |
        cd libgit2
        cmake -S . -B build -G Ninja -DUSE_SSH=libssh2 -DBUILD_TESTS=ON -DEXPERIMENTAL_SHA256=ON -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" -DOPENSSL_CRYPTO_LIBRARY="$env:OPENSSL_CRYPTO_LIBRARY" -DOPENSSL_SSL_LIBRARY="$env:OPENSSL_SSL_LIBRARY" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=D:/libgit2/install -DLIBSSH2_INCLUDE_DIR=D:/libssh2/install/include -DLIBSSH2_LIBRARY=D:/libssh2/install/lib/libssh2.lib
        cmake --build build --parallel --target install

    - name: Run libgit2 tests
      if: steps.validate-cache.outputs.valid != 'true'
      shell: pwsh
      run: .\libgit2\build\libgit2_tests.exe

    - name: Verify cached Windows libraries load
      if: steps.validate-cache.outputs.valid == 'true'
      shell: pwsh
      run: |
        $env:PATH = "D:\export;$env:PATH"
        python -c "import ctypes; ctypes.WinDLL(r'D:\export\libgit2.dll')"

    - name: Export git2 library
      if: steps.validate-cache.outputs.valid != 'true'
      shell: pwsh
      run: |
        Copy-Item D:/libgit2/install/bin/git2-experimental.dll D:/export/libgit2.dll
        $exports = dumpbin /exports D:/export/libgit2.dll | Out-String
        if ($exports -notmatch '\bgit_libgit2_init\b') {
          throw 'git_libgit2_init is missing from libgit2.dll exports'
        }
        if ($exports -notmatch '\bgit_repository_open\b') {
          throw 'git_repository_open is missing from libgit2.dll exports'
        }

    - name: Create Windows cache manifest
      if: steps.validate-cache.outputs.valid != 'true'
      shell: pwsh
      run: |
        python .github/scripts/native_cache_manifest.py create `
          --manifest D:/git2dart-windows-manifest.json `
          --export-root D:/export `
          --platform windows `
          --abi "$env:RUNNER_ARCH" `
          --libgit2 '${{ inputs.libgit2_version }}' `
          --libssh2 '${{ inputs.libssh2_version }}' `
          --openssl '${{ steps.toolchain.outputs.openssl_version }}' `
          --toolchain '${{ steps.toolchain.outputs.fingerprint }}' `
          --provenance source-build `
          --source-ref 'refs/tags/openssl-${{ inputs.openssl_version }}'
        Copy-Item D:/git2dart-windows-manifest.json D:/git2dart-windows-provenance.json
        Copy-Item D:/git2dart-windows-provenance.json D:/export/openssl-provenance.json

    - name: Stage Windows native cache
      if: steps.validate-cache.outputs.valid != 'true'
      shell: pwsh
      run: |
        $cacheRoot = Join-Path $env:GITHUB_WORKSPACE '.native-cache/windows'
        New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null
        foreach ($name in @('libssh2', 'libgit2', 'openssl', 'export')) {
          Copy-Item -LiteralPath (Join-Path 'D:\' $name) -Destination (Join-Path $cacheRoot $name) -Recurse -Force
        }
        Copy-Item -LiteralPath 'D:\git2dart-windows-manifest.json' -Destination (Join-Path $cacheRoot 'git2dart-windows-manifest.json') -Force
        Copy-Item -LiteralPath 'D:\git2dart-windows-provenance.json' -Destination (Join-Path $cacheRoot 'git2dart-windows-provenance.json') -Force

    - name: Save Windows native cache
      if: steps.validate-cache.outputs.valid != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          .native-cache/windows
        key: native-v2-windows-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ inputs.libgit2_version }}-${{ inputs.libssh2_version }}-${{ inputs.openssl_version }}-${{ hashFiles('.github/actions/build-windows/action.yml', '.github/scripts/native_cache_manifest.py') }}

    - name: Cache git2 library
      uses: actions/upload-artifact@v7
      with:
        name: cache-windows
        path: |
          D:/export/**
        retention-days: 1
